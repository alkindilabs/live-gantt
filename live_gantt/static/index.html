<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <title>Live Gantt</title>
    <link rel="icon" href="/favicon.ico" type="image/svg+xml">
    <link rel="stylesheet" href="/style.css">
    <script src="/app.js" defer></script>
  </head>
  <body>
    <main>
      <header class="page-header">
        <div class="identity">
          <h1>Live Gantt</h1>
          <p id="project" class="project">Claude Code sessions</p>
        </div>
        <div id="session-control" class="session-control">
          <button id="session" class="session-button" type="button" aria-haspopup="listbox" aria-expanded="false"
                  aria-controls="session-panel" aria-keyshortcuts="/" title="Switch session (/)">
            <span id="session-title" class="session-title">Loading sessions…</span>
            <span id="session-meta" class="session-meta"></span>
          </button>
          <div id="session-panel" class="session-panel" hidden>
            <div class="session-search">
              <input id="session-filter" type="search" role="combobox" aria-autocomplete="list" aria-expanded="true"
                     aria-controls="session-options" aria-label="Filter sessions by title, prompt or project"
                     placeholder="Filter by title, prompt or project" autocomplete="off" spellcheck="false">
              <label class="session-scope"><input id="session-all" type="checkbox"> All sessions</label>
            </div>
            <ul id="session-options" class="session-options" role="listbox" aria-label="Sessions"></ul>
            <p id="session-summary" class="session-summary"></p>
          </div>
        </div>
        <div id="connection" class="connection disconnected" role="status" aria-live="polite">
          <span class="connection-dot" aria-hidden="true"></span>
          <span id="connection-text">Connecting</span><span id="connection-age" aria-hidden="true"></span>
        </div>
      </header>

      <section id="session-heading" class="session-heading" aria-labelledby="session-name" hidden>
        <h2 id="session-name"></h2>
        <p id="session-description"></p>
      </section>
      <section id="overview" class="overview" aria-labelledby="overview-title" hidden>
        <div class="overview-heading">
          <div>
            <h2 id="overview-title">Plan progress</h2>
            <p id="task-count" class="task-count"></p>
          </div>
          <p id="forecast-health" class="forecast-health"></p>
        </div>
        <div id="milestones" class="milestones" aria-label="Milestone progress and finish estimates"></div>
      </section>
      <section id="freshness" class="freshness-alert" role="alert" aria-label="Stale plan" hidden></section>
      <div class="work-area">
      <section class="chart-shell" aria-label="Session work timeline">
        <div class="toolbar">
          <div class="chart-heading"><h2>Work timeline</h2></div>
          <div class="zoom-controls" role="group" aria-label="Timeline zoom">
            <button type="button" data-zoom="12h" aria-pressed="false">12 h</button>
            <button type="button" data-zoom="3d" aria-pressed="false">3 days</button>
            <button type="button" data-zoom="week" aria-pressed="false">Week</button>
            <button type="button" data-zoom="fit" aria-pressed="false">Fit</button>
          </div>
          <button id="follow" class="follow" type="button" aria-pressed="true">Following now</button>
        </div>
        <details class="legend-disclosure">
        <summary>Status key</summary>
        <div class="legend" aria-label="Status legend">
          <span><i class="legend-swatch done" aria-hidden="true"></i>Done</span>
          <span><i class="legend-swatch running" aria-hidden="true"></i>Running</span>
          <span><i class="legend-swatch projected" aria-hidden="true"></i>Projected</span>
          <span><i class="legend-swatch projected" aria-hidden="true"></i>Queued</span>
          <span><i class="legend-swatch overrun" aria-hidden="true"></i>Overrun</span>
          <span><i class="legend-swatch blocked" aria-hidden="true"></i>Blocked</span>
          <span><i class="legend-swatch silent" aria-hidden="true"></i>Silent</span>
        </div>
        </details>
        <p id="notice" class="notice" role="status">Reading local sessions…</p>
        <div id="timeline" class="timeline" tabindex="0" aria-label="Timeline; scroll horizontally to explore time">
          <div id="timeline-content" class="timeline-content"></div>
        </div>
        <p class="chart-help">Select work to inspect its progress and history. Scroll the timeline to explore time.</p>
      </section>
      <aside id="details" class="details" aria-label="Work details" hidden>
        <div class="details-header"><span>Work details</span><button id="close-details" class="close-details" type="button" aria-label="Close details">Close</button></div>
        <div id="details-content"></div>
      </aside>
      </div>
      <section id="warnings" class="source-warnings" aria-label="Source warnings" hidden></section>
    </main>
  </body>
</html>
